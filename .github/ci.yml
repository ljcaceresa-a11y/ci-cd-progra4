name: Pipeline CI Progra 4

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Preparar entorno Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas automáticas
        env:
          APP_ENV: ${{ vars.APP_ENV || 'produccion' }}
        run: npm test

      - name: Generar Build / Artefacto
        run: npm run build